<!doctype html>
<html>
<head>
  <title>Create Profile – Long Run</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 50px auto; padding: 20px; background: #f5f5f5; }
    h1 { color: #333; text-align: center; margin-bottom: 6px; }
    .sub { text-align: center; color: #888; margin-bottom: 28px; font-size: 0.95rem; }
    form { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; font-size: 0.9rem; }
    input[type="text"], input[type="number"], select {
      width: 100%; padding: 9px 12px; margin-bottom: 18px;
      border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem;
    }
    .check-group { margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 8px; }
    .check-group label {
      display: flex; align-items: center; gap: 6px;
      font-weight: normal; background: #f0f4ff; border: 1px solid #c5d5ff;
      border-radius: 20px; padding: 5px 12px; cursor: pointer; font-size: 0.85rem;
    }
    .check-group input[type="checkbox"] { margin: 0; }
    .check-group label:has(input:checked) { background: #007bff; color: white; border-color: #007bff; }
    button {
      width: 100%; padding: 12px; background: #007bff; color: white;
      border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 6px;
    }
    button:hover { background: #0056b3; }
    .back { display: block; text-align: center; margin-top: 16px; color: #888; font-size: 0.85rem; text-decoration: none; }
  </style>
</head>
<body>
  <h1>Create Runner Profile</h1>
  <p class="sub">Your profile is reused every time you generate a plan.</p>

  <form action="/profile/new" method="post">

    <label>Your name</label>
    <input type="text" name="name" placeholder="e.g. Sam" required />

    <label>Age</label>
    <input type="number" name="age" min="10" max="99" placeholder="e.g. 32" required />

    <label>Experience level</label>
    <select name="experience" required>
      <option value="beginner">Beginner</option>
      <option value="intermediate">Intermediate</option>
      <option value="advanced">Advanced</option>
    </select>

    <label>Current weekly miles</label>
    <input type="number" name="current_weekly_miles" step="0.5" min="0" placeholder="e.g. 20" required />

    <label>Available terrain</label>
    <div class="check-group">
      <label><input type="checkbox" name="available_terrain" value="road" checked /> Road</label>
      <label><input type="checkbox" name="available_terrain" value="trail" /> Trail</label>
      <label><input type="checkbox" name="available_terrain" value="treadmill" /> Treadmill</label>
    </div>

    <label>Training days</label>
    <div class="check-group">
      <label><input type="checkbox" name="training_days" value="Monday" /> Mon</label>
      <label><input type="checkbox" name="training_days" value="Tuesday" /> Tue</label>
      <label><input type="checkbox" name="training_days" value="Wednesday" /> Wed</label>
      <label><input type="checkbox" name="training_days" value="Thursday" /> Thu</label>
      <label><input type="checkbox" name="training_days" value="Friday" /> Fri</label>
      <label><input type="checkbox" name="training_days" value="Saturday" checked /> Sat</label>
      <label><input type="checkbox" name="training_days" value="Sunday" checked /> Sun</label>
    </div>

    <button type="submit">Create Profile</button>
  </form>
  <a class="back" href="/">← Back to home</a>
</body>
</html>
