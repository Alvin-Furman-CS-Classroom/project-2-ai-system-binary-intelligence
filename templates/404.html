<!doctype html>
<html>
  <head>
    <title>404 – Page Not Found</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 60px auto;
        padding: 20px;
        background-color: #f5f5f5;
        color: #333;
        text-align: center;
      }
      h1 {
        font-size: 5rem;
        margin-bottom: 8px;
        color: #c0392b;
      }
      h2 {
        font-size: 1.5rem;
        margin-bottom: 16px;
        color: #555;
      }
      p {
        font-size: 1rem;
        color: #666;
        margin-bottom: 32px;
      }
      a {
        display: inline-block;
        padding: 12px 28px;
        background-color: #2c3e50;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        font-size: 1rem;
      }
      a:hover {
        background-color: #3d5166;
      }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">Back to Home</a>
  </body>
</html>
